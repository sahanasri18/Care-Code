# CareCode — Render Blueprint
# Creates: PostgreSQL database + web service (FastAPI serving React SPA).
#
# Post-deploy steps (set in Render dashboard → Environment tab):
#   1. FRONTEND_URL      = https://<your-service>.onrender.com
#   2. PUBLIC_BASE_URL   = https://<your-service>.onrender.com
#   3. SMTP_*            = your email provider settings (for forgot-password)
#   4. Create admin:      Render Shell → cd backend && python -m app.cli create-admin admin@carecode.io "Admin" "Admin1!Pass"

services:
  - type: web
    name: carecode-api
    runtime: python
    pythonVersion: "3.12"
    plan: free
    buildCommand: |-
      cd frontend && npm ci && npm run build && cd .. &&
      pip install -r backend/requirements.txt
    startCommand: |-
      cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carecode-db
          property: connectionString
      # REQUIRED after first deploy — set to your service's external URL
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # SMTP — leave empty to use console backend (dev); configure for production forgot-password.
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM_NAME
        value: CareCode
      - key: SMTP_FROM_EMAIL
        value: noreply@carecode.example
      - key: SMTP_USE_TLS
        value: "true"

databases:
  - name: carecode-db
    plan: free
    databaseName: carecode
    user: carecode
